<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Home Assistant Agent Interface</title>
  <desc id="desc">A geometric home connected to agent interface nodes on a deep blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="0.55" stop-color="#102a56"/>
      <stop offset="1" stop-color="#123f55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#36d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <circle cx="1050" cy="40" r="190" fill="#38bdf8" opacity="0.06"/>
  <circle cx="110" cy="300" r="180" fill="#36d399" opacity="0.06"/>

  <g transform="translate(84 62)" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 92 104 24l80 68v91H24Z"/>
    <path d="M76 183v-55h56v55"/>
    <path d="M184 92h44"/>
    <path d="M228 92v-42h42"/>
    <path d="M228 92v44h42"/>
    <circle cx="276" cy="50" r="10" fill="#38bdf8" stroke="none" filter="url(#glow)"/>
    <circle cx="276" cy="136" r="10" fill="#36d399" stroke="none" filter="url(#glow)"/>
    <circle cx="228" cy="92" r="10" fill="#ffffff" stroke="none"/>
  </g>

  <g fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="410" y="124" font-size="47" font-weight="700" letter-spacing="-1">Home Assistant</text>
    <text x="410" y="181" font-size="47" font-weight="700" letter-spacing="-1">Agent Interface</text>
    <text x="413" y="223" font-size="20" fill="#a5dff3" letter-spacing="2">DYNAMIC · SEMANTIC · TOKEN-EFFICIENT</text>
  </g>
</svg>
